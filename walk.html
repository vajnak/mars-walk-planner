<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mars first-person walk</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a0d08;font-family:system-ui,"Segoe UI",sans-serif}
#hud{position:fixed;inset:0;pointer-events:none;color:#5ff2e0;font-weight:600;font-size:20px;text-shadow:0 0 4px #000,0 0 2px #000}
#hud div{position:absolute}
#top{top:18px;left:50%;transform:translateX(-50%);text-align:center;font-size:24px}
#arrow{top:62px;left:50%;margin-left:-16px;width:32px;height:32px}
#ret{top:50%;left:50%;width:6px;height:6px;margin:-3px;border:2px solid #5ff2e0;border-radius:50%}
#info{left:24px;bottom:24px;line-height:1.5}
#warn{top:62%;left:50%;transform:translateX(-50%);background:rgba(255,122,69,.92);color:#1a0d08;padding:6px 18px;border-radius:6px;text-shadow:none;display:none}
#start{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;background:rgba(20,8,4,.55);cursor:pointer}
#note{position:fixed;right:12px;bottom:10px;color:#f1d9c8;font-size:13px;text-shadow:0 0 3px #000}
#env{top:78px;right:30px;text-align:right;font-size:15px;line-height:1.45;opacity:.92}
#envn{font-size:11px;opacity:.75;font-weight:400}
#rt{top:104px;left:50%;transform:translateX(-50%);font-size:15px;opacity:.9;white-space:nowrap}
.c{position:fixed;width:50px;height:50px;border:3px solid #5ff2e0;opacity:.8;pointer-events:none}
</style></head><body>
<div id="hud"><div id="top"></div><svg id="arrow" viewBox="0 0 32 32"><path d="M16 2 L28 28 L16 22 L4 28 Z" fill="#5ff2e0" stroke="#000" stroke-width="1.5"/></svg>
<div id="rt"></div><div id="env">ENVIRONMENT<br>TEMP -22 / -83 °C<br>PRESSURE 718 Pa<br>RADIATION 0.67 mSv/day<br>WIND gusts ~10 m/s<br><span id="envn">reference values: NASA MEDA (Jezero),<br>MSL RAD (Gale)</span></div><div id="ret"></div><div id="info"></div><div id="warn">STEEP GROUND</div></div>
<div class="c" style="top:16px;left:16px;border-right:0;border-bottom:0"></div><div class="c" style="top:16px;right:16px;border-left:0;border-bottom:0"></div>
<div class="c" style="bottom:16px;left:16px;border-right:0;border-top:0"></div><div class="c" style="bottom:16px;right:16px;border-left:0;border-top:0"></div>
<div id="start"><div><h1 style="margin:0 0 8px">Click to walk</h1><p style="margin:0 0 14px">W A S D to move · mouse to look · Shift to run · Esc to release</p>
<a href="./" onclick="event.stopPropagation()" style="color:#5ff2e0">← Home</a> · <a href="map.html" onclick="event.stopPropagation()" style="color:#5ff2e0">Plan a route</a></div></div>
<div id="note">N: fine detail · [ and ]: time of day</div>
<script src="three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script>
const EYE=1.7, MAXSLOPE=38, WARN=25; let TARGET=[-60,-222];   // TARGET = [east, z] metres from crop centre (z negative = north)
const SUN=new THREE.Vector3(-0.709,0.5,0.497).normalize(); // sun from the south-west, like the photo's own shadows
const HOR=0xd9a77f;
const $=id=>document.getElementById(id);
let ROUTE=null;try{const r=JSON.parse(localStorage.getItem("marsRoute")||"null");if(r&&r.v===1&&r.path&&r.path.length>1)ROUTE=r}catch(e){}
if(ROUTE){const l=ROUTE.path[ROUTE.path.length-1];TARGET=[l[0],l[1]];$("rt").textContent="ROUTE: "+ROUTE.name+" · slope limit "+ROUTE.limit+"°"}
function synth(){const n=256,h=new Float32Array(n*n);for(let r=0;r<n;r++)for(let c=0;c<n;c++){const x=c/n*6.28,z=r/n*6.28;
  h[r*n+c]=60+35*Math.sin(x*1.3)*Math.cos(z*1.1)+14*Math.sin(x*3.1+z*2.3)+5*Math.sin(x*8+z*6)-40*Math.exp(-(((c-90)**2+(r-120)**2)/1800))}
  return{m:{n,size_m:2000,zmin:0,zmax:130},h,tex:null}}
async function loadLayers(){try{const L=await(await fetch("data/layers.json")).json();const f=async u=>new Uint8Array(await(await fetch(u)).arrayBuffer());
  L.TX=await f("data/texture.bin");L.GB=await f("data/geo.bin");L.SB=new Uint32Array(await(await fetch("data/sun.bin")).arrayBuffer());return L}catch(e){return null}}
async function load(){try{const m=await(await fetch("data/meta.json")).json();
  const h=new Float32Array(await(await fetch("data/height.bin")).arrayBuffer());if(h.length!==m.n*m.n)throw 0;return{m,h,tex:"data/terrain.jpg"}}
  catch(e){$("note").textContent="Demo terrain (no data/ folder found)";return synth()}}
Promise.all([load(),loadLayers()]).then(([{m,h,tex},LY])=>{
 const N=m.n,S=m.size_m;const GB=LY&&LY.GB,TX=LY&&LY.TX,SB=LY&&LY.SB;
 const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(HOR,.00042);
 const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.3,7000);cam.rotation.order="YXZ";
 const rd=new THREE.WebGLRenderer({antialias:true});rd.setSize(innerWidth,innerHeight);rd.setPixelRatio(Math.min(2,devicePixelRatio));
 rd.shadowMap.enabled=true;rd.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(rd.domElement);
 const an=rd.capabilities.getMaxAnisotropy();
 const sky=new THREE.Mesh(new THREE.SphereGeometry(5000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{sun:{value:SUN},top:{value:new THREE.Color(0x8a5f4b)},hor:{value:new THREE.Color(HOR)}},
  vertexShader:"varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader:"varying vec3 d;uniform vec3 sun,top,hor;void main(){float t=pow(clamp(d.y,0.,1.),.55);vec3 c=mix(hor,top,t);float s=max(dot(normalize(d),normalize(sun)),0.);c+=vec3(1.,.85,.65)*(pow(s,600.)*1.6+pow(s,10.)*.25);gl_FragColor=vec4(c,1.);}"}));
 scene.add(sky);
 const g=new THREE.PlaneGeometry(S,S,N-1,N-1);g.rotateX(-Math.PI/2);const p=g.attributes.position;
 let lo=1e9;for(let i=0;i<h.length;i++)lo=Math.min(lo,h[i]);
 for(let i=0;i<h.length;i++)p.setY(i,h[i]-lo);g.computeVertexNormals();
 const mat=new THREE.MeshStandardMaterial({color:tex?0xe08a5e:0xb86a45,roughness:1,metalness:0});
 let nmap=null;
 if(tex){new THREE.TextureLoader().load(tex,t=>{t.anisotropy=an;mat.map=t;mat.needsUpdate=true});
  new THREE.TextureLoader().load("data/normal.png",t=>{t.anisotropy=an;nmap=t;mat.normalMap=t;mat.normalScale.set(1,1);mat.needsUpdate=true},undefined,()=>{})}
 const terrain=new THREE.Mesh(g,mat);terrain.castShadow=true;terrain.receiveShadow=true;scene.add(terrain);
 const sun=new THREE.DirectionalLight(0xfff1de,1.9);sun.position.copy(SUN).multiplyScalar(2500);sun.target.position.set(0,40,0);
 sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);const sc=sun.shadow.camera;sc.left=sc.bottom=-1500;sc.right=sc.top=1500;sc.near=100;sc.far=5000;
 sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.8;const hemi=new THREE.HemisphereLight(0xf0cfae,0x70452f,.55);scene.add(sun,sun.target,hemi);
 const gy=(x,z)=>{const u=Math.max(0,Math.min(N-1.001,(x/S+.5)*(N-1))),v=Math.max(0,Math.min(N-1.001,(z/S+.5)*(N-1))),
  i=Math.floor(u),j=Math.floor(v),a=u-i,b=v-j,H=(r,c)=>h[r*N+c]-lo;
  return H(j,i)*(1-a)*(1-b)+H(j,i+1)*a*(1-b)+H(j+1,i)*(1-a)*b+H(j+1,i+1)*a*b};
 const slope=(x,z)=>{const d=2;return Math.atan(Math.hypot((gy(x+d,z)-gy(x-d,z))/(2*d),(gy(x,z+d)-gy(x,z-d))/(2*d)))*180/Math.PI};
 let hour=16;
 function setHour(hr){hour=hr;if(!LY)return;const s=LY.sun[hr];SUN.set(s.E,s.U,-s.N).normalize();
  const up=s.U>.02,dim=up?Math.min(1,.25+s.el/25):.12;
  sun.position.copy(SUN).multiplyScalar(2500);sun.intensity=up?1.9*Math.min(1,s.el/12+.15):0;hemi.intensity=.12+.43*dim;
  sky.material.uniforms.top.value.setHex(0x8a5f4b).multiplyScalar(dim);sky.material.uniforms.hor.value.setHex(HOR).multiplyScalar(dim);scene.fog.color.setHex(HOR).multiplyScalar(dim)}
 setHour(hour);
 const cellI=(x,z)=>{const G=LY.n,c=Math.max(0,Math.min(G-1,Math.floor((x/S+.5)*G))),r=Math.max(0,Math.min(G-1,Math.floor((z/S+.5)*G)));return r*G+c};
 const tg=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,60,12),new THREE.MeshBasicMaterial({color:0x5ff2e0,fog:false}));
 tg.position.set(TARGET[0],gy(TARGET[0],TARGET[1])+30,TARGET[1]);scene.add(tg);
 let dense=null,total=0;
 if(ROUTE){
  let P=ROUTE.path.map(p=>[p[0],p[1]]);
  for(let it=0;it<3;it++){const Q=P;P=Q.map((p,i)=>i===0||i===Q.length-1?p:[(Q[i-1][0]+p[0]+Q[i+1][0])/3,(Q[i-1][1]+p[1]+Q[i+1][1])/3])}
  const cum=[0];for(let i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  total=cum[cum.length-1];
  const at=d=>{d=Math.max(0,Math.min(total,d));let i=1;while(i<cum.length-1&&cum[i]<d)i++;const t=(d-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]);return[P[i-1][0]+(P[i][0]-P[i-1][0])*t,P[i-1][1]+(P[i][1]-P[i-1][1])*t]};
  dense=[];for(let d=0;d<total;d+=2)dense.push(at(d));dense.push(P[P.length-1]);
  const AG=new THREE.BufferGeometry();AG.setAttribute("position",new THREE.BufferAttribute(new Float32Array([0,0,-1.6,-.95,0,.8,0,0,.25,0,0,-1.6,0,0,.25,.95,0,.8]),3));
  const na=Math.max(1,Math.floor(total/8));
  const arrows=new THREE.InstancedMesh(AG,new THREE.MeshBasicMaterial({color:0x5ff2e0,side:THREE.DoubleSide,fog:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),na);
  const Mx=new THREE.Matrix4(),X=new THREE.Vector3(),Fv=new THREE.Vector3(),Zv=new THREE.Vector3();
  for(let i=0;i<na;i++){const d=4+i*8,a=at(d-1.5),b=at(d+1.5),c=at(d);
   Fv.set(b[0]-a[0],0,b[1]-a[1]).normalize();
   const nn=new THREE.Vector3(-(gy(c[0]+1,c[1])-gy(c[0]-1,c[1]))/2,1,-(gy(c[0],c[1]+1)-gy(c[0],c[1]-1))/2).normalize();
   Fv.addScaledVector(nn,-Fv.dot(nn)).normalize();X.crossVectors(Fv,nn);Zv.copy(Fv).negate();
   Mx.makeBasis(X,nn,Zv);Mx.setPosition(c[0],gy(c[0],c[1])+.45,c[1]);arrows.setMatrixAt(i,Mx)}
  arrows.instanceMatrix.needsUpdate=true;arrows.frustumCulled=false;scene.add(arrows)}

 let x=-100,z=380,yaw=0,pitch=0,sp=0;const k={};
 if(dense){x=dense[0][0];z=dense[0][1];const w=dense[Math.min(8,dense.length-1)];yaw=-Math.atan2(w[0]-x,-(w[1]-z))}
 let ey=gy(x,z)+EYE;
 addEventListener("keydown",e=>{k[e.code]=1;if(LY&&(e.code==="BracketLeft"||e.code==="BracketRight"))setHour((hour+(e.code==="BracketRight"?1:23))%24);if(!nmap)return;
  if(e.code==="KeyN"){mat.normalMap=mat.normalMap?null:nmap;mat.needsUpdate=true}
  if(e.code==="KeyG")mat.normalScale.y*=-1;if(e.code==="KeyH")mat.normalScale.x*=-1});
 addEventListener("keyup",e=>k[e.code]=0);
 const lock=()=>rd.domElement.requestPointerLock();$("start").onclick=lock;rd.domElement.onclick=lock;
 document.addEventListener("pointerlockchange",()=>$("start").style.display=document.pointerLockElement?"none":"grid");
 document.addEventListener("mousemove",e=>{if(document.pointerLockElement){yaw-=e.movementX*.0022;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0022))}});
 addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)});
 let t0=performance.now();
 (function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-t0)/1000);t0=t;
  const f=(k.KeyW?1:0)-(k.KeyS?1:0),r=(k.KeyD?1:0)-(k.KeyA?1:0),v=(k.ShiftLeft||k.ShiftRight)?9:3.5;sp=0;
  if(f||r){const l=Math.hypot(f,r),dx=(-Math.sin(yaw)*f+Math.cos(yaw)*r)/l*v*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*r)/l*v*dt,
   nx=Math.max(-S/2+5,Math.min(S/2-5,x+dx)),nz=Math.max(-S/2+5,Math.min(S/2-5,z+dz)),rise=gy(nx,nz)-gy(x,z),run=Math.hypot(nx-x,nz-z)||1;
   if(Math.atan(rise/run)*180/Math.PI<MAXSLOPE){x=nx;z=nz;sp=v}}
  const gh=gy(x,z);ey+=(gh+EYE-ey)*Math.min(1,dt*10);cam.position.set(x,ey,z);cam.rotation.set(pitch,yaw,0);sky.position.copy(cam.position);
  const hd=((-yaw*180/Math.PI)%360+360)%360,dx=TARGET[0]-x,dz=TARGET[1]-z,br=(Math.atan2(dx,-dz)*180/Math.PI+360)%360,dist=Math.hypot(dx,dz),sl=slope(x,z);
  const dirs=["N","NE","E","SE","S","SW","W","NW"];$("top").textContent=String(Math.round(hd)).padStart(3,"0")+"° "+dirs[Math.round(hd/45)%8];
  let aim=br,rem=null,off=0,ahead=sl;
  if(dense){let bi=0,bd=1e18;for(let i=0;i<dense.length;i++){const q=(dense[i][0]-x)**2+(dense[i][1]-z)**2;if(q<bd){bd=q;bi=i}}
   off=Math.sqrt(bd);rem=Math.max(0,total-bi*2);const wp=dense[Math.min(bi+8,dense.length-1)];aim=(Math.atan2(wp[0]-x,-(wp[1]-z))*180/Math.PI+360)%360;
   ahead=0;for(let j=1;j<=8;j+=2){const q=dense[Math.min(bi+j,dense.length-1)];ahead=Math.max(ahead,slope(q[0],q[1]))}}
  $("arrow").style.transform="rotate("+(aim-hd)+"deg)";
  let gl="",tr="",sn="";
  if(LY){const ci=cellI(x,z),u=LY.geo.find(q=>q.id===GB[ci]),tx=TX[ci]/LY.tex_scale,I=.6*Math.min(sl/25,1)+.4*Math.min(1,tx/LY.tex_p95),s=LY.sun[hour];
   gl="<br>GROUND "+(u?u.label:"unmapped");tr="<br>TERRAIN "+(I>.66?"HARD":I>.33?"MODERATE":"EASY");
   sn="<br>"+String(hour).padStart(2,"0")+":00 · "+(s.el<=.5?"NIGHT":((SB[ci]>>>hour)&1?"SUNLIT":"IN SHADE")+" · sun "+s.el.toFixed(0)+"°")}
  $("info").innerHTML=(rem!==null?"ROUTE LEFT "+Math.round(rem)+" m<br>ETA "+Math.ceil(rem/33.3)+" min<br>":"TARGET "+Math.round(dist)+" m<br>")+"ELEV "+Math.round(lo+gh)+" m<br>SLOPE "+sl.toFixed(0)+"° · AHEAD "+ahead.toFixed(0)+"°<br>SPEED "+sp.toFixed(1)+" m/s<br>POS E "+Math.round(x)+"  N "+Math.round(-z)+gl+tr+sn;
  let msg="",bg="rgba(255,122,69,.92)";
  if(dense&&rem<10){msg="TARGET REACHED";bg="rgba(95,242,224,.92)"}else if(sl>WARN)msg="STEEP GROUND";else if(dense&&off>12)msg="OFF ROUTE";
  $("warn").style.display=msg?"block":"none";$("warn").textContent=msg;$("warn").style.background=bg;rd.render(scene,cam)})(t0);
});
</script></body></html>
